name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:hero
      - name: Check committed WebGL bundle is current
        run: git diff --exit-code -- hero3d.bundle.js

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,physics,api]"
      - run: ruff format --check .
      - run: ruff check .
      # Run the strict static check once on the oldest supported interpreter.
      # Runtime and packaging checks still run across the complete 3.11–3.13 matrix.
      - name: Type check (mypy)
        if: matrix.python-version == '3.11'
        run: python -m mypy --no-incremental --follow-imports=skip --config-file pyproject.toml src/reality
      - run: pytest
      - run: python -m build
      - run: python -m venv .release-venv
      - run: .release-venv/bin/python -m pip install dist/*.whl
      - run: .release-venv/bin/python -c "import reality; print(reality.__name__)"

  cuda:
    # Enable only after configuring a self-hosted NVIDIA runner with this repository
    # variable. The CPU job above remains the required portable release gate.
    if: ${{ vars.REALITY_CUDA_RUNNER == 'true' }}
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gpu]"
      - run: python -m pytest tests/test_gpu.py -q
      - run: python tools/futures_audit.py --full --output FUTURES_AUDIT.md
