[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reality"
version = "0.1.0"
description = "A backend-neutral foundation for programmable physical 3D worlds."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Reality contributors" }]
keywords = ["3d", "geometry", "spatial", "trimesh"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "trimesh>=4.0"]

[project.scripts]
reality = "reality.__main__:main"

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]
physics = ["mujoco>=3.2"]
gpu = ["warp-lang>=1.9"]
learn = ["scikit-learn>=1.4"]

[project.urls]
Homepage = "https://github.com/andaniayan-jpg/reality"
Repository = "https://github.com/andaniayan-jpg/reality"
Issues = "https://github.com/andaniayan-jpg/reality/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reality"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["reality"]
strict = true
