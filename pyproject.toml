[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reality"
version = "0.2.2"
description = "A backend-neutral Python toolkit for programmable physical 3D and CAD worlds."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Reality contributors" }]
keywords = ["3d", "cad", "geometry", "spatial", "physics", "trimesh"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["networkx>=3.0", "numpy>=1.26", "scipy>=1.11", "trimesh>=4.0"]

[project.scripts]
reality = "reality.__main__:main"

[project.optional-dependencies]
dev = ["build>=1.2", "mypy==1.17.1", "pytest>=8.0", "ruff==0.12.10", "twine>=6.0"]
physics = ["mujoco>=3.2"]
# Blender supplies ``bpy`` from its own Python runtime; no PyPI dependency is
# declared so installing Reality never attempts to install an incompatible bpy.
blender = []
gpu = ["warp-lang>=1.9"]
learn = ["scikit-learn>=1.4"]
ai = ["scikit-learn>=1.4"]
video = ["imageio-ffmpeg>=0.6,<1"]
agent = []
mcp = ["httpx>=0.27,<0.29", "mcp>=1.0,<2"]
cad = ["cadquery>=2.5"]
usd = ["usd-core>=24.8"]
assimp = ["pyassimp>=5.2.5"]
api = [
  "boto3>=1.34",
  "email-validator>=2.2",
  "fastapi>=0.115,<0.125",
  "httpx>=0.27,<0.29",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/andaniayan-jpg/reality"
Repository = "https://github.com/andaniayan-jpg/reality"
Issues = "https://github.com/andaniayan-jpg/reality/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reality"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests", "apps/mcp/tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented dependency injection pattern uses Depends() defaults.
"apps/api/reality_api/main.py" = ["B008"]
# The editing operation signatures are deliberately explicit and readable; the
# formatter handles indentation while this module permits long typed call sites.
"src/reality/_editing.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["reality"]
strict = true
# Reality's optional geometry/physics integrations are external implementation
# details. Check this package strictly without recursively type-checking them.
follow_imports = "skip"
ignore_missing_imports = true
# Optional backend adapters depend on third-party packages that do not ship
# stable type information on every supported interpreter. They are exercised
# by runtime tests; core Reality modules remain under strict static checking.
exclude = ["src/reality/(backends|experimental)/"]
